name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go vet and test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The end-to-end tests run the real Python dry-run plugin; PyAV (+ numpy) decodes the test pattern with libavcodec.
      - run: pip install av numpy
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # The job worker's tests skip where jobs cannot run sandboxed: unprivileged, the runner's cgroup is not delegated
      # (and Ubuntu's AppArmor restricts unprivileged user namespaces).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: go test -race -count=1 ./...
      # The tray's desktop notifications, against a fake notification server on a private session bus.
      - name: tray notifications (private D-Bus)
        run: |
          command -v dbus-run-session >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq dbus; }
          dbus-run-session -- go test -race -count=1 -v -run DesktopNotifier ./cmd/openvibe-node | tee /tmp/notify.log
          grep -q -- '--- PASS: TestDesktopNotifierAsksAndHearsTheButtons' /tmp/notify.log
      # So they run again as root (jobs as nobody), in a systemd scope with its cgroup delegated, where
      # OPENVIBE_WORKER_TESTS=require makes them fail instead of skipping. Each test binary lies alone in a directory
      # nobody can read, as a function's executable must (a job gets a copy of that directory).
      - name: worker sandbox tests (root)
        run: |
          d=$(mktemp -d) && chmod 755 "$d"
          for t in 'worker .' 'node ^(TestJobRunsOverTheLink|TestLocalStopEndsJobs)$'; do
            set -- $t
            mkdir -m 755 "$d/$1"
            go test -race -c -o "$d/$1/$1.test" ./internal/$1
            (cd internal/$1 && sudo systemd-run --scope --quiet -p Delegate=yes \
              env OPENVIBE_WORKER_TESTS=require "$d/$1/$1.test" -test.count=1 -test.v -test.run "$2")
          done

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/dist.sh ci
      # OpenVibe.Bot's /install route and BOT_INSTALLER_SOURCE_URL are documented to serve this exact release asset.
      - run: test -s dist/install.sh && cmp -s install/install.sh dist/install.sh
      - run: ls -l dist && cat dist/SHA256SUMS

  go-other-os:
    name: go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The deadline across the real pipe to a Python plugin, the clock it shares with the core, strict timing and the
      # Python SDK's own suite, verbose so the log shows each ran on this OS (and its clock readings), never skipped.
      - name: deadlines across the pipe (verbose)
        run: go test -count=1 -v -run "TestQPC|TestTheClock|TestUntilAndSince|TestPython|TestHelloNamesTheSharedClock|TestPipeDelay|TestWriterQueue|TestStrictTiming" ./internal/mono ./internal/plugins
      - run: go test -count=1 ./...

  python:
    name: plugins (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pillow numpy
      - run: python -m pytest -q plugins/sdk/tests
      - run: python -m pytest -q plugins/dryrun/tests
      - run: python -m pytest -q plugins/adeept_adr036/tests
      - run: python -m pytest -q plugins/cozmo/tests
      - run: python -m pytest -q plugins/relay/tests
      - run: python -m pytest -q plugins/ros2/tests
      - run: python -m pytest -q plugins/computer/tests
      - run: python -m pytest -q plugins/voice/tests
      - run: python -m pytest -q plugins/ai/tests
      - name: packages install
        run: pip install ./plugins/sdk ./plugins/dryrun ./plugins/adeept_adr036 ./plugins/cozmo ./plugins/relay ./plugins/ros2 ./plugins/computer ./plugins/voice ./plugins/ai

  # The bundled drivers where people run them: a LOOI or Cozmo bridge is often a Windows PC, a desk a Mac (owner,
  # 2026-10-27: "work well across multi-platform"). Every plugin's tests and packages, on Windows and macOS.
  python-other-os:
    name: plugins (${{ matrix.os }}, python 3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pillow numpy
      # One run per plugin (their test files share names), every one reported before the job fails.
      - name: each plugin's tests
        shell: bash
        run: |
          failed=""
          for d in sdk dryrun adeept_adr036 cozmo relay ros2 computer voice ai; do
            echo "::group::$d"
            python -m pytest -q "plugins/$d/tests" || failed="$failed $d"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed on ${{ matrix.os }}:$failed"; exit 1; fi
      - name: packages install
        run: pip install ./plugins/sdk ./plugins/dryrun ./plugins/adeept_adr036 ./plugins/cozmo ./plugins/relay ./plugins/ros2 ./plugins/computer ./plugins/voice ./plugins/ai

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh install/install.sh scripts/dist.sh scripts/test-install-stock-server.sh scripts/test-install-pair-args.sh scripts/test-install-worker-config.sh scripts/test-install-computer-config.sh scripts/test-install-claim.sh
      - run: sh scripts/test-install-stock-server.sh
      - run: sh scripts/test-install-pair-args.sh
      - run: sh scripts/test-install-worker-config.sh
      - run: sh scripts/test-install-computer-config.sh
      - run: sh scripts/test-install-claim.sh

  esp32-conformance:
    name: esp32 protocol conformance (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh esp32/test/run.sh

  esp32-compile:
    name: esp32 compile (arduino-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the pinned core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.1.1
          arduino-cli lib install "ArduinoJson@7.4.2"
          arduino-cli lib install "WebSockets@2.6.1"
      - name: Compile the example against this tree's library
        run: |
          mkdir -p build/ovlibs
          cp -r esp32 build/ovlibs/OpenVibeNode
          arduino-cli compile --fqbn esp32:esp32:esp32 --libraries build/ovlibs esp32/examples/Basic
