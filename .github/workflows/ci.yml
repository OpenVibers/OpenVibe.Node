name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go vet and test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The end-to-end tests run the real Python dry-run plugin; PyAV (+ numpy) decodes the test pattern with libavcodec.
      - run: pip install av numpy
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # The job worker's tests skip where jobs cannot run sandboxed: unprivileged, the runner's cgroup is not delegated
      # (and Ubuntu's AppArmor restricts unprivileged user namespaces).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: go test -race -count=1 ./...
      # So they run again as root (jobs as nobody), in a systemd scope with its cgroup delegated, where
      # OPENVIBE_WORKER_TESTS=require makes them fail instead of skipping. Each test binary lies alone in a directory
      # nobody can read, as a function's executable must (a job gets a copy of that directory).
      - name: worker sandbox tests (root)
        run: |
          d=$(mktemp -d) && chmod 755 "$d"
          for t in 'worker .' 'node ^(TestJobRunsOverTheLink|TestLocalStopEndsJobs)$'; do
            set -- $t
            mkdir -m 755 "$d/$1"
            go test -race -c -o "$d/$1/$1.test" ./internal/$1
            (cd internal/$1 && sudo systemd-run --scope --quiet -p Delegate=yes \
              env OPENVIBE_WORKER_TESTS=require "$d/$1/$1.test" -test.count=1 -test.v -test.run "$2")
          done

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/dist.sh ci
      # OpenVibe.Bot's /install route and BOT_INSTALLER_SOURCE_URL are documented to serve this exact release asset.
      - run: test -s dist/install.sh && cmp -s install/install.sh dist/install.sh
      - run: ls -l dist && cat dist/SHA256SUMS

  go-other-os:
    name: go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: go test -count=1 ./...

  python:
    name: plugins (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pillow numpy
      - run: python -m pytest -q plugins/sdk/tests
      - run: python -m pytest -q plugins/dryrun/tests
      - run: python -m pytest -q plugins/adeept_adr036/tests
      - run: python -m pytest -q plugins/cozmo/tests
      - name: packages install
        run: pip install ./plugins/sdk ./plugins/dryrun ./plugins/adeept_adr036 ./plugins/cozmo

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh install/install.sh scripts/dist.sh scripts/test-install-stock-server.sh
      - run: sh scripts/test-install-stock-server.sh
