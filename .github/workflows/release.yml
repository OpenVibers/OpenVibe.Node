name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pillow numpy
      - run: go vet ./... && go test -count=1 ./...
      - run: |
          for p in sdk dryrun adeept_adr036 cozmo; do python -m pytest -q plugins/$p/tests; done
      - run: scripts/dist.sh "${GITHUB_REF_NAME}"
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "OpenVibe Node ${GITHUB_REF_NAME}" --generate-notes
