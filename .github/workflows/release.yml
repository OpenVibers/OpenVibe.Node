name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pillow numpy
      # Ubuntu's AppArmor restricts unprivileged user namespaces, which the worker sandbox tests need; relax it as ci.yml does.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: go vet ./... && go test -count=1 ./...
      - run: |
          for p in sdk dryrun adeept_adr036 cozmo relay; do python -m pytest -q plugins/$p/tests; done
      - run: scripts/dist.sh "${GITHUB_REF_NAME}"
      # Every release must carry the installer OpenVibe.Bot's GET /install route and BOT_INSTALLER_SOURCE_URL are
      # documented to serve (releases/latest/download/install.sh), the plugin bundle the installer downloads, and the
      # checksums it verifies them against.
      - name: the release carries the assets the installer and OpenVibe.Bot depend on
        run: |
          test -s dist/install.sh
          test -s dist/openvibe-node-plugins.tar.gz
          test -s dist/SHA256SUMS
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "OpenVibe Node ${GITHUB_REF_NAME}" --generate-notes
