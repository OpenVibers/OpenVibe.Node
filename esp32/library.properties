sentence=ESP32 client for the OpenVibe Bot device protocol: pairing, control link, drive and actuator commands, telemetry, heartbeat, deadman and e-stop.
paragraph=Implements the bot.device-message@1 device side (protocol sections 1-3) minus jobs and video. The protocol core builds without any Arduino headers and is exercised by a desktop conformance harness; the transport adds WiFi, TLS with the ESP32 CA bundle, arduinoWebSockets and NVS.
